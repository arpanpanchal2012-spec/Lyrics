<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>DMHT Lyrics Library</title><style>body{background:#f5f3ef;color:#262821;font:16px system-ui;margin:0}header{background:#263d35;color:#fff;padding:20px}header div,main{max-width:1050px;margin:auto}header strong{font-size:22px}main{padding:24px}a{color:#146451}header a{color:#fff}button,.button{background:#176c53;color:white;border:0;border-radius:7px;padding:10px 16px;cursor:pointer;text-decoration:none;font:inherit}button.secondary,.button.secondary{background:#e8ede8;color:#234c3d}input,textarea{font:inherit;padding:10px;border:1px solid #abb8ac;border-radius:6px;box-sizing:border-box;width:100%}textarea{min-height:320px;line-height:1.6}label{display:block;font-weight:600;margin:15px 0 5px}.card{background:white;border:1px solid #dedfd8;border-radius:12px;padding:20px;margin:15px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row input{flex:1;min-width:180px}.muted{color:#65716a}pre{white-space:pre-wrap;line-height:1.7}.error{color:#9c1d21}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top form{margin:0}small{color:#60756a}</style><script>try{const h=new URLSearchParams(location.hash.slice(1)),origin=h.get('studioOrigin'),nonce=h.get('nonce');if(origin&&/^https?:\/\//.test(origin)&&/^[0-9a-f]{48}$/.test(nonce)){let u=new URL(origin);if(u.origin===origin){sessionStorage.setItem('dmhtStudioOrigin',origin);sessionStorage.setItem('dmhtStudioNonce',nonce);history.replaceState(null,'',location.pathname+location.search)}}}catch(e){}</script></head><body><header><div class="top"><strong>DMHT Lyrics Library</strong>{% if session.get('user') %}<div class="row"><a href="/">Library</a><span>{{ session['user'] }}</span><form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf() }}"><button class="secondary">Sign out</button></form></div>{% endif %}</div></header><main>{% block body %}{% endblock %}</main></body></html>
